[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-saver"
version = "0.1.0"
description = "Local semantic memory in front of TypeSafe Jev: answer repeated decisions locally, ask Jev only when unsure."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "sentence-transformers"]

[tool.setuptools]
packages = ["jev_saver"]
